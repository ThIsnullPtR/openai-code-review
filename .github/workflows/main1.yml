name: Run Java Git Diff Analysis

on:
  push:
    branches: [ 'master' ]  # 仅在推送到 master 时触发
  pull_request:
    branches: [ 'master' ]  # 仅当 PR 目标分支是 master 时触发

jobs:
  analyze-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # 检出最近两个提交用于比较差异

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Compile and run Java code
        run: |
          cd openai-code-review-sdk/src/main/java
          javac com/itgy/sdk/OpenAiCodeReview.java
          java com.itgy.sdk.OpenAiCodeReview
